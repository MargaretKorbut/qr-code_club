spring:
  application:
    name: club

  datasource:
    url: jdbc:postgresql://localhost:5432/qrclub
    username: qrclub_user
    password: qrclub_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true